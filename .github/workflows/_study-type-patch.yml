name: Apply study classification patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature/study-type-classification'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/study-type-classification
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Reassemble and apply deterministic patch
        run: |
          test "$(git hash-object tools/_study_patch_v3.00)" = "6a54a22b37c6104c936ae597c8dbe57c8f2d642a"
          test "$(git hash-object tools/_study_patch_v3.01)" = "d923d9c7a51323abd9b4b0f4ecfeacf42c3a01ba"
          test "$(git hash-object tools/_study_patch_v3.02)" = "96968a8bf8bdfe0ae6b0720f0485bfb61f7707cb"
          test "$(git hash-object tools/_study_patch_v3.03)" = "501448f5fbddf145663f257872b4732feec48457"
          head -c 2800 tools/_study_patch_v3.04 > /tmp/study-part-04
          test "$(git hash-object /tmp/study-part-04)" = "02f4b4dfed3d18af766fd52c90616d6163162c55"
          test "$(git hash-object tools/_study_patch_v3.05)" = "bcd43e2a8f7555ab5012662e30466d6c237de806"
          cat tools/_study_patch_v3.00 tools/_study_patch_v3.01 tools/_study_patch_v3.02 tools/_study_patch_v3.03 /tmp/study-part-04 tools/_study_patch_v3.05 > /tmp/study_patch.b64
          base64 -d /tmp/study_patch.b64 | gzip -t
          base64 -d /tmp/study_patch.b64 | gzip -d > tools/_study_patch.py
          python -m py_compile tools/_study_patch.py
          python tools/_study_patch.py

      - name: Commit feature delta
        run: |
          rm -f tools/_study_patch.py tools/_study_patch.py.gz.b64 tools/_study_patch_v2.py.gz.b64 tools/_study_patch_v3.0? .github/workflows/_study-type-patch.yml
          git config user.name "EvidenceRadar feature bot"
          git config user.email "evidenceradar-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat: add auditable study type classification"
          git push origin HEAD:feature/study-type-classification
