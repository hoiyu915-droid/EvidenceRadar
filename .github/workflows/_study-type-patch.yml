name: Apply study classification patch

on:
  push:
    branches:
      - feature/study-type-classification
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'push' || github.head_ref == 'feature/study-type-classification'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/study-type-classification
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Apply deterministic patch
        run: |
          base64 -d tools/_study_patch_v2.py.gz.b64 | gzip -d > tools/_study_patch.py
          python tools/_study_patch.py

      - name: Commit feature delta
        run: |
          rm -f tools/_study_patch.py tools/_study_patch.py.gz.b64 tools/_study_patch_v2.py.gz.b64 .github/workflows/_study-type-patch.yml
          git config user.name "EvidenceRadar feature bot"
          git config user.email "evidenceradar-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat: add auditable study type classification"
          git push origin HEAD:feature/study-type-classification
