name: Daily Evidence Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
      timezone: "Asia/Tokyo"
  push:
    branches:
      - main
    paths:
      - ".manual-run"

permissions:
  contents: write

concurrency:
  group: daily-evidence-radar
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Generate radar
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python src/run.py

      - name: Commit radar output and persistent state
        run: |
          if [ -z "$(git status --porcelain -- daily/ state/)" ]; then
            echo "No radar or state changes."
            exit 0
          fi
          git config user.name "evidence-radar[bot]"
          git config user.email "evidence-radar[bot]@users.noreply.github.com"
          git add -- daily/ state/
          git commit -m "radar: add scan and update literature registry"
          git push
