name: EvidenceRadar daily (GitHub Actions lane)

on:
  # Producer/schema changes should immediately produce a fresh handoff request.
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "schemas/**"
      - "config/**"
      - "EVIDENCE_RADAR_PROTOCOL.md"
      - "requirements.txt"
      - ".github/workflows/daily-radar.yml"
      # Operational control path: changing only this request file starts a
      # formal Radar run without mutating producer/runtime source.
      - ".github/evidenceradar-run-request.json"
  # 06:17 in Asia/Tokyo.  The non-zero minute avoids the busiest top-of-hour
  # scheduling window while retaining a stable daily handoff.
  schedule:
    - cron: "17 6 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      publisher_target_min:
        description: "Per-run successful publisher access target (default: 10)"
        required: false
        default: 10
        type: number
      publisher_hard_max:
        description: "Per-run publisher network-attempt hard maximum (default: 15)"
        required: false
        default: 15
        type: number

# Hosted Actions performs Stage A only. It reads canonical State and uploads a
# TranslationRequest artifact; it does not publish or advance State.
permissions:
  contents: read

concurrency:
  group: evidence-radar-daily-${{ github.ref }}
  cancel-in-progress: false

env:
  RADAR_ROOT: "."
  RADAR_STATE_PATH: "state/current/EvidenceRadar_State.json"
  EXECUTION_LANE: "github_actions"
  PUBLISHER_TARGET_MIN: ${{ inputs.publisher_target_min || 10 }}
  PUBLISHER_HARD_MAX: ${{ inputs.publisher_hard_max || 15 }}
  OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
  OPENREVIEW_TOKEN: ${{ secrets.OPENREVIEW_TOKEN }}
  NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
  NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}

jobs:
  daily-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f legacy/python-runtime/requirements.txt ]; then
            pip install -r legacy/python-runtime/requirements.txt
          fi

      - name: Validate repository and active-lane tests
        run: |
          python tools/validate_public_release.py
          python tools/validate_gpt_work_artifacts.py --root "$RADAR_ROOT"
          python -m unittest discover -s tests -v

      - name: Run archived-runtime regression tests
        working-directory: legacy/python-runtime
        run: python -m pytest -q tests

      - name: Run EvidenceRadar GitHub lane
        id: radar
        env:
          RADAR_OUTPUT_DIR: ${{ runner.temp }}/evidenceradar-pending-output
          RADAR_TRANSLATION_REQUEST: ${{ runner.temp }}/EvidenceRadar_TranslationRequest.json
        run: |
          mkdir -p "$RADAR_OUTPUT_DIR"
          result="$(python tools/run_github_radar.py \
            --root "$RADAR_ROOT" \
            --output-dir "$RADAR_OUTPUT_DIR" \
            --state "$RADAR_STATE_PATH" \
            --execution-lane "$EXECUTION_LANE" \
            --publisher-target-min "$PUBLISHER_TARGET_MIN" \
            --publisher-hard-max "$PUBLISHER_HARD_MAX" \
            --translation-request "$RADAR_TRANSLATION_REQUEST")"
          echo "$result"
          status="$(python -c 'import json,sys; print(json.loads(sys.stdin.read())["run_status"])' <<<"$result")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          test "$status" = "TRANSLATION_REQUIRED"
          test -s "$RADAR_TRANSLATION_REQUEST"

      - name: Upload TranslationRequest for ordinary ChatGPT handoff
        if: steps.radar.outputs.status == 'TRANSLATION_REQUIRED'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: evidenceradar-translation-request-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/EvidenceRadar_TranslationRequest.json
