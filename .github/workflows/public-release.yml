name: Public release validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate public-release hygiene
        run: python tools/validate_public_release.py
      - name: Validate artifact examples
        run: python tools/validate_gpt_work_artifacts.py --root .
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
