name: Public release validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install active-lane dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate public-release hygiene
        run: python tools/validate_public_release.py
      - name: Validate artifact examples
        run: python tools/validate_gpt_work_artifacts.py --root .
      - name: Validate canonical delivery bundle
        run: |
          python tools/validate_delivery_bundle.py \
            --root . \
            --bundle artifacts/current \
            --canonical-state state/current/EvidenceRadar_State.json \
            --require-current-producer \
            --reject-dirty
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
