name: Public release validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install active-lane dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate public-release hygiene
        run: python tools/validate_public_release.py
      - name: Validate artifact examples
        run: python tools/validate_gpt_work_artifacts.py --root .
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
      - name: Detect canonical bundle changes in this revision
        id: canonical_change
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          changed=false
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            base="$EVENT_BASE_SHA"
            if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
              base="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
            fi
            if ! git diff --quiet "$base" HEAD -- artifacts/current state/current/EvidenceRadar_State.json; then
              changed=true
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Require current producer when canonical bytes change
        if: steps.canonical_change.outputs.changed == 'true'
        run: |
          PYTHONDONTWRITEBYTECODE=1 python tools/validate_delivery_bundle.py \
            --root . \
            --bundle artifacts/current \
            --canonical-state state/current/EvidenceRadar_State.json \
            --require-current-producer \
            --require-semantic-contract-v3 \
            --reject-dirty
      - name: Validate committed canonical bundle against its recorded producer
        shell: bash
        run: |
          set -euo pipefail
          protocol_commit="$(python - <<'PY'
          import json
          from pathlib import Path
          run = json.loads(Path('artifacts/current/EvidenceRadar_Run.json').read_text(encoding='utf-8'))
          print(run.get('protocol_commit', ''))
          PY
          )"
          if ! [[ "$protocol_commit" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::canonical Run protocol_commit is not a full Git commit SHA: $protocol_commit"
            exit 1
          fi
          git cat-file -e "$protocol_commit^{commit}"
          producer_root="$RUNNER_TEMP/evidenceradar-producer-$protocol_commit"
          git worktree add --detach "$producer_root" "$protocol_commit"
          trap 'git worktree remove --force "$producer_root" >/dev/null 2>&1 || true' EXIT
          PYTHONDONTWRITEBYTECODE=1 python "$producer_root/tools/validate_delivery_bundle.py" \
            --root "$producer_root" \
            --bundle "$GITHUB_WORKSPACE/artifacts/current" \
            --canonical-state "$GITHUB_WORKSPACE/state/current/EvidenceRadar_State.json" \
            --require-current-producer \
            --require-semantic-contract-v3 \
            --reject-dirty
