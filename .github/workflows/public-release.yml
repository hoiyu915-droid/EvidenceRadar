name: Public release validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install active-lane dependencies
        run: |
          python -m pip install -r requirements.txt
          if [ -f legacy/python-runtime/requirements.txt ]; then
            python -m pip install -r legacy/python-runtime/requirements.txt
          fi
      - name: Materialize master-control migration
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/master-control-sources-taxonomy'
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/evidenceradar-master-control-payload.b64 | tar -xzf -
          python apply_migration.py
          python -m py_compile \
            tools/radar_control.py \
            tools/publisher_feed.py \
            tools/generate_legacy_config.py \
            tools/run_github_radar.py
          python -m unittest tests.test_radar_control tests.test_publisher_feed -v
          python tools/generate_legacy_config.py --master config/radar_master.json --profile current_focus --out-dir "$RUNNER_TEMP/current-focus"
          python tools/generate_legacy_config.py --master config/radar_master.json --profile general_research --out-dir "$RUNNER_TEMP/general-research"
          python tools/generate_legacy_config.py --master config/radar_master.json --profile current_plus_general --out-dir "$RUNNER_TEMP/current-plus-general"
      - name: Validate public-release hygiene
        run: python tools/validate_public_release.py
      - name: Validate artifact examples
        run: python tools/validate_gpt_work_artifacts.py --root .
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
      - name: Run archived-runtime regression tests for master-control migration
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/master-control-sources-taxonomy'
        working-directory: legacy/python-runtime
        run: python -m pytest -q tests
      - name: Validate committed canonical bundle against its recorded producer
        shell: bash
        run: |
          set -euo pipefail
          protocol_commit="$(python - <<'PY'
          import json
          from pathlib import Path
          run = json.loads(Path('artifacts/current/EvidenceRadar_Run.json').read_text(encoding='utf-8'))
          print(run.get('protocol_commit', ''))
          PY
          )"
          if ! [[ "$protocol_commit" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::canonical Run protocol_commit is not a full Git commit SHA: $protocol_commit"
            exit 1
          fi
          git cat-file -e "$protocol_commit^{commit}"
          producer_root="$RUNNER_TEMP/evidenceradar-producer-$protocol_commit"
          git worktree add --detach "$producer_root" "$protocol_commit"
          trap 'git worktree remove --force "$producer_root" >/dev/null 2>&1 || true' EXIT
          PYTHONDONTWRITEBYTECODE=1 python "$producer_root/tools/validate_delivery_bundle.py" \
            --root "$producer_root" \
            --bundle "$GITHUB_WORKSPACE/artifacts/current" \
            --canonical-state "$GITHUB_WORKSPACE/state/current/EvidenceRadar_State.json" \
            --require-current-producer \
            --require-semantic-contract-v3 \
            --reject-dirty
      - name: Commit validated master-control migration
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/master-control-sources-taxonomy'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "evidence-radar[bot]"
          git config user.email "evidence-radar[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/public-release.yml
          git rm -- .github/evidenceradar-master-control-payload.b64 .github/workflows/apply-master-control.yml
          rm -f apply_migration.py
          git add -- \
            .github/workflows/public-release.yml \
            .github/workflows/daily-radar.yml \
            config/radar_master.json \
            tools/radar_control.py \
            tools/publisher_feed.py \
            tools/generate_legacy_config.py \
            tools/run_github_radar.py \
            tests/test_radar_control.py \
            tests/test_publisher_feed.py \
            README_MIGRATION.md
          git diff --cached --check
          git commit -m "feat: centralize radar sources and taxonomy"
          git push origin HEAD:${GITHUB_HEAD_REF}
