name: Apply scalable Copilot translation fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/maintenance/apply_scalable_copilot_fix.py"
      - ".github/workflows/apply-scalable-copilot-fix.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR head
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          if [ -f legacy/python-runtime/requirements.txt ]; then
            python -m pip install -r legacy/python-runtime/requirements.txt
          fi

      - name: Apply bounded product patch
        run: |
          set -euo pipefail
          python .github/maintenance/apply_scalable_copilot_fix.py
          rm .github/maintenance/apply_scalable_copilot_fix.py
          git diff --check

      - name: Run targeted translation scaling tests
        run: |
          python -m unittest -v \
            tests.test_meaningful_summary_contract \
            tests.test_copilot_translation_scaling \
            tests.test_runtime_release

      - name: Run full release gates
        run: |
          python tools/validate_public_release.py
          python tools/validate_gpt_work_artifacts.py --root .
          python -m unittest discover -s tests -v
          (cd legacy/python-runtime && python -m pytest -q tests)

      - name: Commit product delta to PR branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "EvidenceRadar maintenance bot"
          git config user.email "evidenceradar-bot@users.noreply.github.com"
          git add -- \
            tools/run_github_radar.py \
            config/output.yml \
            runtime/VERSION \
            tests/test_runtime_release.py \
            tests/test_copilot_translation_scaling.py \
            .github/maintenance/apply_scalable_copilot_fix.py
          if git diff --cached --quiet; then
            echo "::error::patch produced no product delta"
            exit 1
          fi
          git commit -m "fix: scale Copilot title translation"
          git push origin "HEAD:$HEAD_REF"
