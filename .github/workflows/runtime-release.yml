name: Runtime release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "runtime/**"
      - "docs/RUNTIME_RELEASE.md"
      - "docs/MIGRATION_DUAL_LANE_1.0.md"
      - "docs/SEMANTIC_CONTRACT_V3.md"
      - "docs/WORK_SETUP.md"
      - "docs/research_taxonomy.md"
      - "release/work-pack-manifest.json"
      - "EVIDENCE_RADAR_PROTOCOL.md"
      - "requirements.txt"
      - "config/**"
      - "schemas/**"
      - "templates/**"
      - "examples/**"
      - "tools/build_runtime_release.py"
      - "tools/build_work_pack.py"
      - "tools/delivery_contract.py"
      - "tools/featured_selection.py"
      - "tools/merge_radar_state.py"
      - "tools/materialize_delivery_aliases.py"
      - "tools/package_work_delivery.py"
      - "tools/publisher_feed.py"
      - "tools/radar_control.py"
      - "tools/render_report_from_artifacts.py"
      - "tools/run_github_radar.py"
      - "tools/run_local_runtime.py"
      - "tools/translation_handoff.py"
      - "tools/validate_delivery_bundle.py"
      - "tools/validate_gpt_work_artifacts.py"
      - "tools/verify_runtime_release.py"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Require exact main checkout
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "::error::Runtime releases must run from main"
            exit 1
          fi
          git fetch --no-tags origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "::error::Runtime release checkout is not the current origin/main commit"
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "::error::Runtime release checkout is dirty"
            exit 1
          fi

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install active runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate public release surface
        run: |
          python tools/validate_public_release.py
          python tools/validate_gpt_work_artifacts.py --root .
          python -m unittest discover -s tests -v

      - name: Build deterministic Runtime ZIP
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_runtime_release.py --output-dir dist > "$RUNNER_TEMP/runtime-build.json"
          cat "$RUNNER_TEMP/runtime-build.json"
          version="$(python - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads((Path(os.environ['RUNNER_TEMP']) / 'runtime-build.json').read_text(encoding='utf-8'))
          print(value['runtime_version'])
          PY
          )"
          archive="EvidenceRadar-Runtime-v${version}.zip"
          checksum="${archive}.sha256"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Verify Runtime ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_runtime_release.py \
            --archive "dist/${{ steps.build.outputs.archive }}" \
            --checksum "dist/${{ steps.build.outputs.checksum }}"
          mkdir "$RUNNER_TEMP/runtime-extracted"
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path('dist') / os.environ['ARCHIVE']
          target = Path(os.environ['RUNNER_TEMP']) / 'runtime-extracted'
          with ZipFile(archive) as value:
              value.extractall(target)
          PY
          PYTHONDONTWRITEBYTECODE=1 python "$RUNNER_TEMP/runtime-extracted/tools/verify_runtime_release.py" \
            --root "$RUNNER_TEMP/runtime-extracted"
          PYTHONDONTWRITEBYTECODE=1 python "$RUNNER_TEMP/runtime-extracted/tools/run_local_runtime.py" --help >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python "$RUNNER_TEMP/runtime-extracted/tools/run_github_radar.py" --help >/dev/null
        env:
          ARCHIVE: ${{ steps.build.outputs.archive }}

      - name: Refuse mutable version reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="runtime-v${{ steps.build.outputs.version }}"
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "::error::immutable Runtime tag already exists: $tag; bump runtime/VERSION for package changes"
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::immutable Runtime release already exists: $tag; bump runtime/VERSION for package changes"
            exit 1
          fi

      - name: Publish immutable GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.build.outputs.version }}"
          tag="runtime-v${version}"
          gh release create "$tag" \
            "dist/${{ steps.build.outputs.archive }}" \
            "dist/${{ steps.build.outputs.checksum }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EvidenceRadar Runtime v${version}" \
            --notes "Immutable local Runtime release for source commit $GITHUB_SHA. Verify the ZIP with the attached .sha256 sidecar before extraction. Runtime source is read-only; State and generated artifacts remain external. See docs/RUNTIME_RELEASE.md in this commit for the execution contract."
