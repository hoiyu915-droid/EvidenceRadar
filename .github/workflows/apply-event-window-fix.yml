name: One-time EvidenceRadar event-window fix

# Registered on main; this PR merge supplies the push trigger.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-event-window-fix.yml"

permissions:
  contents: write
  actions: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply bounded source patch
        run: python .github/maintenance/apply_event_window_fix.py

      - name: Verify patch and regression suite
        run: |
          git diff --check
          python -m py_compile tools/run_github_radar.py
          python -m unittest discover -s tests -v

      - name: Commit bounded producer fix
        run: |
          git config user.name "EvidenceRadar maintenance"
          git config user.email "evidenceradar-maintenance@users.noreply.github.com"
          git add -- tools/run_github_radar.py
          if git diff --cached --quiet; then
            echo "::error::bounded patch produced no source change"
            exit 1
          fi
          git commit -m "fix: gate Radar priority on 72h qualifying events"
          git push origin "HEAD:main"

      - name: Run the fixed Radar producer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run daily-radar.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
