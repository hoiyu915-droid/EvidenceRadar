name: Inspect post-release workflow runs

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/maintenance/inspect-post-release-runs.txt"

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current main delivery workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '--- daily-radar.yml ---'
          gh run list --repo "$GITHUB_REPOSITORY" --workflow daily-radar.yml --branch main --limit 6 --json databaseId,event,headSha,status,conclusion,createdAt,updatedAt,url
          echo '--- runtime-release.yml ---'
          gh run list --repo "$GITHUB_REPOSITORY" --workflow runtime-release.yml --branch main --limit 6 --json databaseId,event,headSha,status,conclusion,createdAt,updatedAt,url
          echo '--- pages.yml ---'
          gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --branch main --limit 6 --json databaseId,event,headSha,status,conclusion,createdAt,updatedAt,url
          echo '--- public-release.yml ---'
          gh run list --repo "$GITHUB_REPOSITORY" --workflow public-release.yml --branch main --limit 6 --json databaseId,event,headSha,status,conclusion,createdAt,updatedAt,url

      - name: Read back Runtime v1.0.2 when published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view runtime-v1.0.2 --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,url,assets > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            echo 'runtime-v1.0.2 not published yet'
            exit 0
          fi
          cat "$RUNNER_TEMP/release.json"
          mkdir -p "$RUNNER_TEMP/runtime-readback"
          gh release download runtime-v1.0.2 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'EvidenceRadar-Runtime-v1.0.2.zip*' \
            --dir "$RUNNER_TEMP/runtime-readback"
          cd "$RUNNER_TEMP/runtime-readback"
          test -s EvidenceRadar-Runtime-v1.0.2.zip
          test -s EvidenceRadar-Runtime-v1.0.2.zip.sha256
          sha256sum -c EvidenceRadar-Runtime-v1.0.2.zip.sha256
          unzip -l EvidenceRadar-Runtime-v1.0.2.zip | head -80
