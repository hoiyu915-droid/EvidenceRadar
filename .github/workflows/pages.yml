name: Publish EvidenceRadar report

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "artifacts/current/**"
      - "requirements.lock"
      - "state/current/EvidenceRadar_State.json"
      - "runs/**"
      - "tools/build_pages_site.py"
      - "tools/delivery_contract.py"
      - "tools/promote_workrun_bundle.py"
      - "tools/strict_json.py"
      - "tools/validate_delivery_bundle.py"
      - "tools/validate_gpt_work_artifacts.py"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: evidenceradar-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out complete producer history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require exact main checkout
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Pages deployments must run from main"
            exit 1
          fi
          git fetch --no-tags origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::Pages checkout is not the current origin/main commit"
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install active-lane dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Fail closed if GitHub Pages is not enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type // ""' 2>/dev/null || true)"
          if [ "$build_type" != "workflow" ]; then
            echo "::error::GitHub Pages is not enabled with Build and deployment Source=GitHub Actions for this repository"
            echo "Enable Settings > Pages > Build and deployment > GitHub Actions, then rerun this workflow."
            exit 1
          fi
          echo "GitHub Pages preflight: build_type=$build_type"

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Resolve previous immutable history revision
        id: history_baseline
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            push) history_baseline="$EVENT_BEFORE" ;;
            pull_request) history_baseline="$PR_BASE_SHA" ;;
            *)
              echo "::error::unsupported Pages event: $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac
          if ! [[ "$history_baseline" =~ ^[0-9a-f]{40}$ ]] || \
            [[ "$history_baseline" =~ ^0+$ ]]; then
            echo "::error::Pages history baseline must be a prior full commit SHA"
            exit 1
          fi
          resolved="$(git rev-parse --verify "${history_baseline}^{commit}" 2>/dev/null || true)"
          if [ "$resolved" != "$history_baseline" ]; then
            echo "::error::Pages history baseline commit is unavailable: $history_baseline"
            exit 1
          fi
          if [ "$resolved" = "$GITHUB_SHA" ] || \
            ! git merge-base --is-ancestor "$resolved" "$GITHUB_SHA"; then
            echo "::error::Pages history baseline must precede the deployed revision"
            exit 1
          fi
          echo "ref=$resolved" >> "$GITHUB_OUTPUT"

      - name: Detect canonical byte changes
        id: canonical_changes
        env:
          HISTORY_BASELINE: ${{ steps.history_baseline.outputs.ref }}
        run: |
          set -euo pipefail
          canonical_changed=false
          if ! git diff --quiet "$HISTORY_BASELINE" "$GITHUB_SHA" -- \
            artifacts/current state/current/EvidenceRadar_State.json; then
            canonical_changed=true
          fi
          echo "canonical_changed=$canonical_changed" >> "$GITHUB_OUTPUT"

      - name: Require current producer for changed canonical bytes
        if: steps.canonical_changes.outputs.canonical_changed == 'true'
        run: |
          PYTHONDONTWRITEBYTECODE=1 python tools/validate_delivery_bundle.py \
            --root . \
            --bundle artifacts/current \
            --canonical-state state/current/EvidenceRadar_State.json \
            --require-current-producer \
            --require-semantic-contract-v3 \
            --reject-dirty

      - name: Build the public report site from the validated canonical bundle
        run: |
          PYTHONDONTWRITEBYTECODE=1 python tools/build_pages_site.py \
            --root . \
            --bundle artifacts/current \
            --canonical-state state/current/EvidenceRadar_State.json \
            --repository "$GITHUB_REPOSITORY" \
            --base-url "${{ steps.pages.outputs.base_url }}" \
            --history-manifest runs/pages-history.json \
            --history-baseline-ref "${{ steps.history_baseline.outputs.ref }}" \
            --skip-current-producer-check \
            --output-dir _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy report
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Publish clickable links in the run summary
        run: |
          echo "## EvidenceRadar report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Open the latest HTML report](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Open link metadata](${{ steps.deployment.outputs.page_url }}links.json)" >> "$GITHUB_STEP_SUMMARY"
