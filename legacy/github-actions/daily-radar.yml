# ARCHIVED: files outside .github/workflows are inert. Regression fixture only;
# never move this file back to activate a user Radar run.
name: EvidenceRadar daily (GitHub Actions lane)

on:
  # Connector-controlled operational entrypoint. Only a repository-owner issue
  # carrying the exact run-request marker is allowed to start Stage A.
  issues:
    types: [opened]
  # Producer/schema changes should immediately produce a fresh handoff request.
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "schemas/**"
      - "config/**"
      - "EVIDENCE_RADAR_PROTOCOL.md"
      - "requirements.txt"
      - "requirements.lock"
      - "legacy/python-runtime/requirements.lock"
      - "legacy/github-actions/daily-radar.yml"
      # Operational control path: changing only this request file starts a
      # formal Radar run without mutating producer/runtime source.
      - ".github/evidenceradar-run-request.json"
  # 06:17 in Asia/Tokyo. The non-zero minute avoids the busiest top-of-hour
  # scheduling window while retaining a stable daily handoff.
  schedule:
    - cron: "17 6 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      publisher_target_min:
        description: "Optional manual override; blank uses profile/master limit"
        required: false
        type: number
      publisher_hard_max:
        description: "Optional manual override; blank uses profile/master limit"
        required: false
        type: number

# Hosted Actions performs Stage A only. It reads canonical State, uploads a
# TranslationRequest artifact, and creates a metadata-only Work queue issue;
# it does not publish or advance State.
permissions:
  contents: read
  issues: write

concurrency:
  group: evidence-radar-daily-${{ github.ref }}
  cancel-in-progress: false

env:
  RADAR_ROOT: "."
  RADAR_STATE_PATH: "state/current/EvidenceRadar_State.json"
  RADAR_PROFILE: "owner_daily"
  EXECUTION_LANE: "github_actions"
  PUBLISHER_TARGET_MIN: ${{ inputs.publisher_target_min || '' }}
  PUBLISHER_HARD_MAX: ${{ inputs.publisher_hard_max || '' }}
  OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
  OPENREVIEW_TOKEN: ${{ secrets.OPENREVIEW_TOKEN }}
  NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
  NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}

jobs:
  daily-radar:
    # A reviewed control-plane-only merge may carry this exact marker to avoid
    # re-running discovery while an immutable Stage A request is still queued.
    # Issue-triggered runs are fail-closed: only the repository owner with the
    # exact v1 marker can enter the producer. Handoff issues cannot recurse.
    if: >-
      ${{
        (github.event_name != 'push' ||
         !contains(github.event.head_commit.message, '[skip-evidenceradar-stage-a]')) &&
        (github.event_name != 'issues' ||
         (github.event.issue.user.login == github.repository_owner &&
          contains(github.event.issue.body, '<!-- evidenceradar-run-request:v1 -->')))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          if [ -f legacy/python-runtime/requirements.lock ]; then
            pip install --require-hashes -r legacy/python-runtime/requirements.lock
          fi

      - name: Validate repository and active-lane tests
        run: |
          python tools/validate_public_release.py
          python tools/validate_gpt_work_artifacts.py --root "$RADAR_ROOT"
          python -m unittest discover -s tests -v

      - name: Run archived-runtime regression tests
        working-directory: legacy/python-runtime
        run: python -m pytest -q tests

      - name: Validate immutable master-controlled runtime
        run: |
          python tools/apply_master_runtime_config.py --root "$RADAR_ROOT" --profile "$RADAR_PROFILE" --check
          python tools/apply_master_control_runtime.py --runner tools/run_github_radar.py --check
          python -m py_compile \
            tools/run_github_radar.py \
            tools/radar_control.py \
            tools/publisher_feed.py \
            tools/apply_master_runtime_config.py \
            tools/package_work_delivery.py \
            tools/materialize_delivery_aliases.py
          git diff --exit-code -- tools config

      - name: Run EvidenceRadar GitHub lane
        id: radar
        env:
          RADAR_OUTPUT_DIR: ${{ runner.temp }}/evidenceradar-pending-output
          RADAR_TRANSLATION_REQUEST: ${{ runner.temp }}/EvidenceRadar_TranslationRequest.json
        run: |
          mkdir -p "$RADAR_OUTPUT_DIR"
          publisher_args=()
          if [ -n "${PUBLISHER_TARGET_MIN:-}" ]; then
            publisher_args+=(--publisher-target-min "$PUBLISHER_TARGET_MIN")
          fi
          if [ -n "${PUBLISHER_HARD_MAX:-}" ]; then
            publisher_args+=(--publisher-hard-max "$PUBLISHER_HARD_MAX")
          fi
          result="$(python tools/run_github_radar.py \
            --root "$RADAR_ROOT" \
            --output-dir "$RADAR_OUTPUT_DIR" \
            --state "$RADAR_STATE_PATH" \
            --execution-lane "$EXECUTION_LANE" \
            --profile "$RADAR_PROFILE" \
            "${publisher_args[@]}" \
            --translation-request "$RADAR_TRANSLATION_REQUEST")"
          echo "$result"
          status="$(python -c 'import json,sys; print(json.loads(sys.stdin.read())["run_status"])' <<<"$result")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          test "$status" = "TRANSLATION_REQUIRED"
          test -s "$RADAR_TRANSLATION_REQUEST"
          git diff --exit-code -- tools config

      - name: Upload TranslationRequest for ChatGPT Work handoff
        id: upload_request
        if: steps.radar.outputs.status == 'TRANSLATION_REQUIRED'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidenceradar-translation-request-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/EvidenceRadar_TranslationRequest.json

      - name: Queue checkpointed ChatGPT Work continuation
        id: queue_request
        if: steps.radar.outputs.status == 'TRANSLATION_REQUIRED'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_PATH: ${{ runner.temp }}/EvidenceRadar_TranslationRequest.json
          ARTIFACT_ID: ${{ steps.upload_request.outputs.artifact-id }}
          ARTIFACT_NAME: evidenceradar-translation-request-${{ github.run_id }}-${{ github.run_attempt }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          queue_dir="$RUNNER_TEMP/evidenceradar-work-queue"
          mkdir -p "$queue_dir"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          request = json.loads(Path(os.environ["REQUEST_PATH"]).read_text(encoding="utf-8"))
          artifact_id = int(os.environ["ARTIFACT_ID"])
          metadata = {
              "schema_version": "1.0",
              "artifact_type": "EvidenceRadar_WorkQueueEntry",
              "status": "TRANSLATION_REQUIRED",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_run_id": int(os.environ["WORKFLOW_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["WORKFLOW_RUN_ATTEMPT"]),
              "artifact_id": artifact_id,
              "artifact_name": os.environ["ARTIFACT_NAME"],
              "request_sha256": request["request_sha256"],
              "radar_run_id": request["run_id"],
              "protocol_commit": request["protocol_commit"],
              "base_state_sha256": request["base_state_sha256"],
              "candidate_count": len(request["candidates"]),
          }
          title = f"EvidenceRadar handoff {request['request_sha256'][:12]}"
          body = (
              "<!-- evidenceradar-work-queue:v1 -->\n"
              "This issue is a metadata-only queue entry for the checkpointed ChatGPT Work continuation.\n\n"
              "```json\n"
              + json.dumps(metadata, ensure_ascii=False, indent=2, sort_keys=True)
              + "\n```\n"
          )
          queue_dir = Path(os.environ["RUNNER_TEMP"]) / "evidenceradar-work-queue"
          (queue_dir / "title.txt").write_text(title + "\n", encoding="utf-8")
          (queue_dir / "body.md").write_text(body, encoding="utf-8")
          PY
          if ! gh label list --limit 100 --json name --jq '.[].name' | grep -Fxq 'evidenceradar-handoff'; then
            gh label create evidenceradar-handoff \
              --color 6f42c1 \
              --description 'Pending checkpointed ChatGPT Work continuation'
          fi
          title="$(tr -d '\n' < "$queue_dir/title.txt")"
          existing="$(gh issue list \
            --state all \
            --label evidenceradar-handoff \
            --search "${title} in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"${title}\") | .number" \
            | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$queue_dir/body.md"
            gh issue reopen "$existing" >/dev/null 2>&1 || true
          else
            created_url="$(gh issue create \
              --title "$title" \
              --body-file "$queue_dir/body.md" \
              --label evidenceradar-handoff)"
            existing="${created_url##*/}"
          fi
          test -n "$existing"
          echo "handoff_number=$existing" >> "$GITHUB_OUTPUT"

      - name: Complete owner run request
        if: ${{ github.event_name == 'issues' && steps.queue_request.outputs.handoff_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ISSUE_NUMBER: ${{ github.event.issue.number }}
          HANDOFF_NUMBER: ${{ steps.queue_request.outputs.handoff_number }}
        run: |
          set -euo pipefail
          gh issue comment "$REQUEST_ISSUE_NUMBER" \
            --body "owner_daily Stage A created handoff #${HANDOFF_NUMBER} from producer ${GITHUB_SHA}. Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue close "$REQUEST_ISSUE_NUMBER" --reason completed

      - name: Report owner run request failure
        if: ${{ always() && github.event_name == 'issues' && steps.queue_request.outputs.handoff_number == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue comment "$REQUEST_ISSUE_NUMBER" \
            --body "owner_daily Stage A did not create a handoff. Producer: ${GITHUB_SHA}. Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. This request is intentionally left open for inspection or retry."
