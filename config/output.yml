execution:
  owners: [chatgpt_work, github_actions]
  lanes:
    chatgpt_work:
      method: live_web_search_and_direct_source_read
      trigger: user_launched
      repository_writeback: false
    github_actions:
      method: automated_discovery_and_source_access_audit
      trigger: scheduled_or_workflow_dispatch
      repository_writeback: generated_artifacts_and_canonical_state
  mcp: false
  external_server: false
  codex: false
  github_actions: true

window:
  timezone: Asia/Tokyo
  rolling_hours: 72
  exclude_date_only_cutoff_day: true

artifacts:
  primary_delivery:
    filename: EvidenceRadar_Report.html
    format: self_contained_html
    requirements:
      - source_coverage_matrix
      - concise_conclusions
      - category_sections
      - event_evidence
      - claim_support
      - caveats
      - identifiers
      - direct_links
      - conflicts_and_gaps
  state:
    filename: EvidenceRadar_State.json
    schema: schemas/evidence-radar-state.schema.json
  evidence:
    filename: EvidenceRadar_Evidence.json
    schema: schemas/evidence-radar-evidence.schema.json
  run:
    filename: EvidenceRadar_Run.json
    schema: schemas/evidence-radar-run.schema.json

run_statuses:
  - COMPLETE
  - PARTIAL_SOURCE_COVERAGE
  - SOURCE_ACCESS_GAP
  - STATE_HISTORY_INCOMPLETE
  - NO_QUALIFYING_ITEMS

state_rules:
  prior_state_optional_on_first_run: true
  missing_or_invalid_prior_state_status: STATE_HISTORY_INCOMPLETE
  advance_only_after_artifact_validation: true
  never_notify_unverified_events: true
  canonical_repository_path: state/current/EvidenceRadar_State.json
  merge_tool: tools/merge_radar_state.py
  concurrent_runs_require_deterministic_merge: true

provenance:
  required_for_new_runs:
    - execution_lane
    - protocol_commit
    - base_state_sha256
    - parent_run_ids
  execution_lanes: [chatgpt_work, github_actions]

publisher_output:
  settings_file: config/deployment.yml
  output_unit: accessible_publisher_or_source_page_audit_record

selection:
  scope: per_category
  categories:
    - clinical_medicine
    - sport_science
    - sport_nutrition_fitness
    - llm_research
    - human_ai
  featured:
    target_min: 5
    hard_max: 8
  candidate_pool:
    hard_max_per_category: 30
    total_hard_max: 150
    includes_featured: true
  allow_below_minimum_when_insufficient: true
  padding_forbidden: true

rendering:
  language: zh-TW
  preserve_original_title: true
  include_main_caveat: true
  include_identifiers: true
  include_source_locators: true
  include_numeric_surface: true
  github_blob_is_not_a_preview: true
