output:
  format: markdown
  extension: ".md"
  directory: "daily"
  timezone: "Asia/Tokyo"
  filename_pattern: "%Y%m%d %H%M.Rader.md"
  example_filename: "20260712 0630.Rader.md"

selection:
  scope: per_category
  categories:
    - clinical_medicine
    - sport_science
    - sport_nutrition_fitness
    - llm_research
    - human_ai
  featured:
    target_min: 5
    hard_max: 8
  candidate_pool:
    hard_max_per_category: 30
    total_hard_max: 150
    includes_featured: true
  allow_below_minimum_when_insufficient: true
  padding_forbidden: true

sections:
  anchor_evidence:
    hard_max_per_category: 8
  strong_watch:
    hard_max_per_category: 8
  weird_but_important:
    hard_max_per_category: 2

candidate_fields:
  - title
  - authors
  - journal_or_venue
  - publication_date
  - category
  - stream
  - study_design
  - evidence_tier
  - relevance_score
  - interest_score
  - open_access
  - doi
  - pmid
  - pmcid
  - openalex_id
  - one_line_reason
  - research_directions
  - history_status

streams:
  - clinical_medicine
  - sport_science
  - sport_nutrition
  - fitness_health
  - llm_l1_model_behavior
  - llm_l2_context_inference
  - llm_l3_retrieval_grounding
  - llm_l4_memory_personalization
  - llm_l5_agents_decision
  - llm_l6_multi_agent
  - llm_l7_systems_runtime
  - llm_l8_training_architecture
  - llm_l9_evaluation_measurement
  - human_h1_llm_relationship
  - human_h2_ai_hci

rendering:
  language: "zh-TW"
  preserve_original_title: true
  include_abstract_summary: true
  include_main_caveat: true
  include_identifiers: true
  candidate_pool_detail: compact
  auto_triage_label: true
