lookback_days: 3
per_query: 40

streams:
  clinical_medicine:
    sources: [pubmed]
    relevance_terms:
      - randomized controlled trial
      - systematic review
      - meta-analysis
      - clinical guideline
      - diagnosis
      - screening
      - treatment
      - prevention
      - prognosis
      - mortality
      - morbidity
      - adverse event
      - public health
    queries:
      - '(("JAMA Netw Open"[Journal] OR "EClinicalMedicine"[Journal] OR "BMC Med"[Journal] OR "BMJ Open"[Journal] OR "Commun Med (Lond)"[Journal] OR "PLoS Med"[Journal] OR "BMJ Med"[Journal] OR "Lancet Reg Health West Pac"[Journal] OR "Lancet Reg Health Eur"[Journal] OR "Lancet Reg Health Am"[Journal]) NOT (protocol[Title] OR letter[Publication Type] OR editorial[Publication Type] OR comment[Publication Type]))'
      - '(((meta-analysis[Publication Type] OR systematic review[Publication Type] OR randomized controlled trial[Publication Type] OR practice guideline[Publication Type]) AND humans[MeSH Terms]) NOT (protocol[Title] OR letter[Publication Type] OR editorial[Publication Type] OR comment[Publication Type]))'
      - '(("N Engl J Med"[Journal] OR Lancet[Journal] OR JAMA[Journal] OR BMJ[Journal] OR "Ann Intern Med"[Journal] OR "Nat Med"[Journal]) AND (clinical trial[Publication Type] OR randomized controlled trial[Publication Type] OR meta-analysis[Publication Type] OR systematic review[Publication Type]) NOT (protocol[Title] OR letter[Publication Type] OR editorial[Publication Type]))'

  sport_science:
    sources: [pubmed]
    relevance_terms:
      - exercise physiology
      - resistance training
      - endurance training
      - athletic performance
      - muscle hypertrophy
      - fatigue
      - recovery
      - biomechanics
      - training load
      - strength
      - power
      - occupational physical activity
    queries:
      - '(("exercise physiology"[Title/Abstract] OR "resistance training"[Title/Abstract] OR "endurance training"[Title/Abstract] OR "athletic performance"[Title/Abstract] OR "muscle hypertrophy"[Title/Abstract] OR biomechanics[Title/Abstract] OR "training load"[Title/Abstract]) NOT (protocol[Title] OR letter[Publication Type] OR editorial[Publication Type] OR comment[Publication Type]))'
      - '((exercise[Title] OR athlete*[Title] OR sport*[Title] OR muscle[Title] OR training[Title]) AND (fatigue[Title/Abstract] OR recovery[Title/Abstract] OR strength[Title/Abstract] OR power[Title/Abstract] OR adaptation[Title/Abstract]) NOT (protocol[Title] OR letter[Publication Type] OR editorial[Publication Type] OR comment[Publication Type]))'

  sport_nutrition:
    sources: [pubmed]
    relevance_terms:
      - sports nutrition
      - carbohydrate availability
      - protein
      - creatine
      - hydration
      - supplement
      - energy availability
      - RED-S
      - body composition
      - nutritional periodization
      - recovery nutrition
    queries:
      - '(("sports nutrition"[Title/Abstract] OR "energy availability"[Title/Abstract] OR RED-S[Title/Abstract] OR "relative energy deficiency"[Title/Abstract] OR "carbohydrate availability"[Title/Abstract]) NOT (protocol[Title] OR letter[Publication Type] OR editorial[Publication Type]))'
      - '((athlete*[Title] OR sport*[Title] OR exercise[Title] OR training[Title] OR performance[Title] OR recovery[Title]) AND (protein[Title] OR carbohydrate*[Title] OR creatine[Title] OR hydration[Title] OR rehydration[Title] OR supplement*[Title] OR nutrition*[Title] OR diet*[Title]) NOT (protocol[Title] OR letter[Publication Type] OR editorial[Publication Type]))'

  fitness_health:
    sources: [pubmed]
    relevance_terms:
      - physical fitness
      - physical activity
      - cardiorespiratory fitness
      - muscular strength
      - sedentary behaviour
      - mortality
      - aging
      - sarcopenia
      - exercise medicine
      - step count
      - dose response
    queries:
      - '(("physical fitness"[Title/Abstract] OR "cardiorespiratory fitness"[Title/Abstract] OR "muscular strength"[Title/Abstract] OR "step count"[Title/Abstract] OR "sedentary behavior"[Title/Abstract] OR "sedentary behaviour"[Title/Abstract]) NOT (protocol[Title] OR letter[Publication Type] OR editorial[Publication Type]))'
      - '((("physical activity"[Title] OR exercise[Title] OR walking[Title] OR sarcopenia[Title]) AND (mortality[Title/Abstract] OR aging[Title/Abstract] OR "dose-response"[Title/Abstract] OR health[Title/Abstract])) NOT (protocol[Title] OR letter[Publication Type] OR editorial[Publication Type]))'

